EIO:CFG_1.0:6:0::
#
# ABB RobotStudio Virtual Controller I/O Configuration File
# Project 18 — Automated Tray-to-Box Packing Robotic Work Cell
# Robot: ABB IRB 1200-7/0.7
#
# Load into Virtual Controller:
# RobotStudio -> Controller Tab -> Configuration -> Load Parameters -> Select EIO.cfg -> Warmstart
#

INDUSTRIAL_NETWORK:

   -Name "Virtual" -Connection "Internal" -Label "Virtual Local Bus"

EIO_UNIT:

   -Name "Virtual_IO_Board" -UnitType "Virtual" -Bus "Virtual" -Address "0"

EIO_SIGNAL:

   # -------------------------------------------------------------
   # Digital Inputs (Sensors -> Robot Controller)
   # -------------------------------------------------------------
   -Name "diTrayReady" -SignalType "DI" -Device "Virtual_IO_Board"\
   -DeviceMap "0" -Label "Feeder Tray in Position and Verified" -Access "All"

   -Name "diPartPresent" -SignalType "DI" -Device "Virtual_IO_Board"\
   -DeviceMap "1" -Label "Workpiece Present in Current Feeder Slot" -Access "All"

   -Name "diBoxPresent" -SignalType "DI" -Device "Virtual_IO_Board"\
   -DeviceMap "2" -Label "Empty Packing Box Locked at Packing Station" -Access "All"

   -Name "diGripConfirmed" -SignalType "DI" -Device "Virtual_IO_Board"\
   -DeviceMap "3" -Label "Vacuum Pressure Switch Confirmed Suction Grip" -Access "All"

   -Name "diBoxExitClear" -SignalType "DI" -Device "Virtual_IO_Board"\
   -DeviceMap "4" -Label "Outfeed Conveyor Path Unobstructed" -Access "All"

   -Name "diEmergencyStop" -SignalType "DI" -Device "Virtual_IO_Board"\
   -DeviceMap "5" -Label "Safety Circuit Healthy / Not Tripped" -Default 1 -Access "All"

   -Name "diCellGateClosed" -SignalType "DI" -Device "Virtual_IO_Board"\
   -DeviceMap "6" -Label "Perimeter Safety Interlock Closed" -Default 1 -Access "All"

   # -------------------------------------------------------------
   # Digital Outputs (Robot Controller -> Actuators / Conveyors / Smart Components)
   # -------------------------------------------------------------
   -Name "doVacuumOn" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "0" -Label "Energize Vacuum Ejector Valve" -Access "All"

   -Name "doInfeedRun" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "1" -Label "Run Infeed Conveyor (Empty Boxes)" -Access "All"

   -Name "doOutfeedRun" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "2" -Label "Run Outfeed Conveyor (Completed Boxes)" -Access "All"

   -Name "doBoxFull" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "3" -Label "Box Packing Complete (4 Slots Populated)" -Access "All"

   -Name "doCycleComplete" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "4" -Label "One Full Box Cycle Completed" -Access "All"

   -Name "doReplenishTray" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "5" -Label "Trigger Feeder Tray Part Replenishment" -Access "All"

   -Name "doRobotInHome" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "6" -Label "Robot Position Confirmed at Home" -Access "All"

   -Name "doRobotInFeederZone" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "7" -Label "Robot Operating Inside Feeder Station Zone" -Access "All"

   -Name "doRobotInBoxZone" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "8" -Label "Robot Operating Inside Box Packing Zone" -Access "All"

   -Name "doStopBladeLower" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "9" -Label "Retract Pneumatic Box Stop Blade" -Access "All"

   -Name "doCellAlarm" -SignalType "DO" -Device "Virtual_IO_Board"\
   -DeviceMap "10" -Label "Workcell Fault / Alarm Annunciator" -Access "All"
